<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grok Glasses</title>
<style>body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:12px;font-size:20px}h1{margin:0 0 4px;font-size:28px}
button,label.btn{display:block;box-sizing:border-box;text-align:center;width:100%;font-size:24px;padding:14px;margin:8px 0;background:#000;color:#fff;border:3px solid #fff;border-radius:14px}
button:focus,label.btn:focus-within{background:#fff;color:#000}#err{color:#f66}#info{color:#ccc;font-size:18px}
input[type=text]{width:100%;box-sizing:border-box;font-size:24px;padding:12px;background:#000;color:#fff;border:3px solid #fff;border-radius:14px}
video,img{width:100%;max-height:160px;object-fit:cover;border:2px solid #fff;margin-top:6px}.big{font-size:26px;font-weight:bold}.box{min-height:1.2em;margin:6px 0}.hide{display:none}</style></head><body>
<h1>Grok Glasses</h1><div>Connected. Ready.</div><div id="info" class="box"></div><div id="err" class="box"></div>
<form id="f"><input id="q" type="text" placeholder="Ask Grok (dictate or type)" enterkeyhint="send"><button type="submit">Send</button></form>
<div id="rp" class="box big"></div>
<button id="rec">Record</button><div id="tx" class="box"></div><audio id="aud" controls class="hide" style="width:100%"></audio>
<button id="cam">Start Camera</button><video id="v" autoplay playsinline muted class="hide"></video>
<button id="shot" class="hide">Shutter</button>
<label class="btn">Choose / Take Photo<input id="file" type="file" accept="image/*" capture="environment" class="hide"></label>
<canvas id="c" class="hide"></canvas><img id="th" class="hide"><div id="an" class="box big"></div>
<script>
const API_BASE="https://grok-glasses-server.conscious-carnation.workers.dev";
const $=id=>document.getElementById(id),err=m=>{$("err").textContent=m?"Error: "+m:""},show=(id,on=true)=>$(id).classList.toggle("hide",!on);
let hist=[],sent="",mr,chunks=[],sr,stream,cs;
async function api(p,b){const r=await fetch(API_BASE+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j.text}
async function ask(t){t=(t||"").trim();if(!t||t===sent)return;sent=t;err("");$("rp").textContent="Grok is thinking...";try{const a=await api("/chat",{text:t,history:hist});hist.push({role:"user",content:t},{role:"assistant",content:a});hist=hist.slice(-10);$("rp").textContent=a}catch(e){$("rp").textContent="";err(e.message)}}
async function devs(){try{if(!navigator.mediaDevices||!navigator.mediaDevices.enumerateDevices)return null;return await navigator.mediaDevices.enumerateDevices()}catch(e){return null}}
async function hasKind(k){const d=await devs();return d?d.some(x=>x.kind===k):null}
async function initInfo(){const d=await devs();if(!d){$("info").textContent="No camera/mic API here. Use the text box and photo picker.";return}
const v=d.filter(x=>x.kind==="videoinput").length,a=d.filter(x=>x.kind==="audioinput").length;
$("info").textContent=`Cameras: ${v}, mics: ${a}.`+(v?"":" Use the photo picker.")+(a?"":" Use the text box (dictation) to talk.");}
$("f").onsubmit=e=>{e.preventDefault();const t=$("q").value;$("q").value="";sent="";ask(t)};
$("rec").onclick=async()=>{err("");try{if(mr&&mr.state==="recording"){mr.stop();sr&&sr.stop();ask($("tx").textContent);$("rec").textContent="Record";return}
if(await hasKind("audioinput")===false)return err("No microphone available to this web app. Tap the text box above and dictate instead.");
stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mr=new MediaRecorder(stream);
mr.ondataavailable=e=>chunks.push(e.data);mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const a=$("aud");a.src=URL.createObjectURL(new Blob(chunks));show("aud")};mr.start();$("rec").textContent="Stop";
const R=window.SpeechRecognition||window.webkitSpeechRecognition;
if(R){sr=new R();sr.continuous=true;sr.interimResults=true;sr.onresult=e=>{$("tx").textContent=[...e.results].map(r=>r[0].transcript).join(" ");const l=e.results[e.results.length-1];if(l.isFinal)ask(l[0].transcript)};sr.onerror=e=>err("speech: "+e.error);sr.start()}
else $("tx").textContent="No live transcription here. Use the text box to dictate.";}catch(e){err(e.name+": "+e.message+" — use the text box instead.")}};
$("cam").onclick=async()=>{err("");try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return err("Camera API not available. Use Choose / Take Photo.");
if(await hasKind("videoinput")===false)return err("No camera available to this web app. Use Choose / Take Photo.");
try{cs=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})}catch(e1){cs=await navigator.mediaDevices.getUserMedia({video:true})}
$("v").srcObject=cs;show("v");show("shot")}catch(e){err(e.name+": "+e.message+" — use Choose / Take Photo.")}};
async function analyze(d){$("th").src=d;show("th");$("an").textContent="Grok is looking...";try{$("an").textContent=await api("/analyze",{image:d})}catch(e){$("an").textContent="";err(e.message)}}
$("shot").onclick=()=>{const v=$("v");if(!v.videoWidth)return err("start the camera first");const c=$("c");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);analyze(c.toDataURL("image/jpeg",0.7))};
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;err("");const img=new Image();img.onload=()=>{const s=Math.min(1,1024/Math.max(img.width,img.height)),c=$("c");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);analyze(c.toDataURL("image/jpeg",0.7))};img.onerror=()=>err("could not read image");img.src=URL.createObjectURL(f)};
initInfo();
</script></body></html>
