name: GrokGlasses
options:
  bundleIdPrefix: com.xoanon.grokglasses
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  GrokGlasses:
    type: application
    platform: iOS
    sources:
      - GrokGlasses
    info:
      path: GrokGlasses/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xoanon.grokglasses.GrokGlasses
        INFOPLIST_FILE: GrokGlasses/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATDisplay
      - package: MWDAT
        product: MWDATMockDevice
      - package: MWDAT
        product: MWDATSpeech
